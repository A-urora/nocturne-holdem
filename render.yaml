services:
  - type: web
    name: nocturne-holdem
    runtime: node
    plan: free
    region: singapore
    buildCommand: "npm install"
    startCommand: "node server.js"
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # 创建 Neon 项目后，把连接串填到 Render 的 DATABASE_URL。
      # sync: false 会让 Render 在首次部署时提示输入该变量。
      - key: DATABASE_URL
        sync: false
